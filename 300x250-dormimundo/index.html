<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=300,height=250">
<title>Dormimundo Haz tu Agosto 300x250</title>
<style>
  html,body{margin:0;padding:0;}
  #banner{position:relative;width:300px;height:250px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;cursor:pointer;}
  .bg{position:absolute;left:0;top:0;width:300px;height:250px;}
  .producto1{animation:fadeClosed 7s infinite;}
  .producto2{animation:fadeOpen 7s infinite;}
  @keyframes fadeClosed {
    0%   { opacity:1; }
    40%  { opacity:1; }
    50%  { opacity:0; }
    90%  { opacity:0; }
    100% { opacity:1; }
  }
  @keyframes fadeOpen {
    0%   { opacity:0; }
    40%  { opacity:0; }
    50%  { opacity:1; }
    90%  { opacity:1; }
    100% { opacity:0; }
  }
</style>
</head>
<body>
<div id="banner" onclick="window.open(window.clickTag, '_blank');">
    <img src="assets/background.png" class="bg" alt="">
    <img src="assets/top.png" style="position:absolute;left:58px;top:11px;width:204px;height:51px;" alt="">
    <img src="assets/promo.png" style="position:absolute;left:0px;top:66px;width:156px;height:69px;" alt="">
    <img src="assets/copy_2en1.svg" style="position:absolute;left:12px;top:141.84px;width:58px;height:46.31px;" alt="">
    <img src="assets/copy_colchones.png" style="position:absolute;left:191px;top:97px;width:97px;height:32px;" alt="">
    <img src="assets/copy_date.png" style="position:absolute;left:75px;top:222px;width:151px;height:8px;" alt="">
    <div class="producto-wrap" style="position:absolute;left:94px;top:116px;width:112px;height:106px;">
      <img src="assets/producto1.png" class="producto producto1" style="position:absolute;left:0;bottom:0px;width:112px;height:73px;" alt="">
      <img src="assets/producto2.png" class="producto producto2" style="position:absolute;left:0;bottom:0px;width:112px;height:106px;" alt="">
    </div>
    <img src="assets/cta.png" style="position:absolute;left:204px;top:149px;width:85px;height:35px;" alt="">
    <img src="assets/disclaimer.svg" style="position:absolute;left:22px;top:238px;width:256px;height:6px;" alt="">
</div>
<script>
  var clickTag = "https://www.dormimundo.com.mx/";
</script>
</body>
</html>
